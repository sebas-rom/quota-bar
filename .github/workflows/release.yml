name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode toolchain
        run: |
          ls /Applications | grep -E '^Xcode.*\.app$' || true
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version
      - run: make zip
      - uses: softprops/action-gh-release@v2
        with:
          files: QuotaBar.zip
          generate_release_notes: true
